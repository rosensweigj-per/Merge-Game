<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4fc0f2">
<title>Harbor Merge</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harbor Merge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=202611121356">
</head>
<body>
<main id="app">
  <header class="hud">
    <button class="who-chip" id="whoChip" title="Switch player"><span class="av" id="whoAv"></span><span class="nm" id="whoName"></span></button>
    <div class="level" title="Player level">
      <span class="lvl-badge" id="level">1</span>
      <div class="xpbar"><div id="xpfill"></div></div>
    </div>
    <div class="pill" title="Coins"><span>🪙</span><b id="coins">0</b></div>
    <div class="pill" title="Gems"><span>💎</span><b id="gems">0</b></div>
  </header>

  <section id="view-board" class="view active">
    <div class="orders" id="orders" aria-label="Orders"></div>
    <div class="board" id="board" aria-label="Merge board"></div>
    <div class="infobar" id="info"></div>
    <div class="storage-wrap">
      <div class="storage-label">📦 Storage</div>
      <div class="storage" id="storage"></div>
    </div>
  </section>

  <section id="view-fun" class="view">
    <div id="fun"></div>
  </section>

  <section id="view-town" class="view">
    <div class="tools" id="tools"></div>
    <div id="town"></div>
  </section>

  <section id="view-progress" class="view">
    <div id="progress"></div>
  </section>

  <section id="view-shop" class="view">
    <div id="shop"></div>
  </section>

  <nav class="tabs">
    <button data-view="board" class="active">🧩<span>Board</span></button>
    <button data-view="fun">🎡<span>Fun</span><i class="dot" id="funDot"></i></button>
    <button data-view="town">🏘️<span>Town</span></button>
    <button data-view="progress">📈<span>Progress</span><i class="dot" id="goalDot"></i></button>
    <button data-view="shop">🛍️<span>Shop</span></button>
  </nav>
</main>

<div class="picker" id="who"><div class="who-inner">
  <h1>🏖️ Harbor Merge</h1>
  <h2>Who's playing?</h2>
  <div class="who-list" id="whoList"></div>
  <div id="syncBar"></div>
</div></div>
<div class="fishing" id="fishing">
  <div class="fish-top">
    <button class="ghost" data-fish="close">← Back</button>
    <div class="pill" title="Bait"><span>🪱</span><b id="baitCount">0</b></div>
  </div>
  <div class="fish-scene" id="fishScene" data-phase="idle">
    <div class="sun"></div>
    <div class="waves"></div>
    <div class="line"></div>
    <div class="bobber"></div>
    <div class="bang">!</div>
    <div class="catch" id="catch"></div>
    <div class="pier"></div>
    <div class="rod">🎣</div>
  </div>
  <div class="reel"><div class="zone" id="zone"></div><div class="marker" id="marker"></div></div>
  <p class="fish-msg" id="fishMsg"></p>
  <button class="cast" id="castBtn" data-fish="cast">Cast 🎣</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>

<script src="js/cloud-config.js?v=202611121356"></script>
<script src="js/data.js?v=202611121356"></script>
<script src="js/game.js?v=202611121356"></script>
</body>
</html>
